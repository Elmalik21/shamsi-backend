[phases.setup]
# Python 3.12 + psycopg2 deps. GIS packages removed - not needed without PostGIS.
nixPkgs = ["python312", "python312Packages.pip", "postgresql", "gcc"]

[phases.install]
cmds = [
    "python -m venv /opt/venv",
    ". /opt/venv/bin/activate && pip install --upgrade pip && pip install -r requirements.txt"
]

[phases.build]
cmds = [
    "export DJANGO_SETTINGS_MODULE=shamsi_smart.settings && . /opt/venv/bin/activate && python manage.py collectstatic --noinput"
]

[start]
cmd = "export DJANGO_SETTINGS_MODULE=shamsi_smart.settings && . /opt/venv/bin/activate && python manage.py migrate --noinput && gunicorn shamsi_smart.wsgi:application --workers 3 --bind 0.0.0.0:$PORT --timeout 120"
