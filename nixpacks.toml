[phases.setup]
# Python 3.12 + psycopg2 deps. GIS packages removed - not needed without PostGIS. cache-bust=2
nixPkgs = ["python312", "python312Packages.pip", "postgresql", "gcc"]

[phases.install]
cmds = [
    "python -m venv /opt/venv",
    ". /opt/venv/bin/activate && pip install --upgrade pip && pip install -r requirements.txt"
]

[phases.build]
cmds = [
    "echo 'Build phase complete — collectstatic runs at startup'"
]

[start]
# workers=2 (not 3) to avoid OOM when torch loads per-worker on Railway Free Tier
cmd = "export DJANGO_SETTINGS_MODULE=shamsi_smart.settings.production && . /opt/venv/bin/activate && python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py seed_locations && python manage.py loaddata solar_data/fixtures/egyptian_electricity_tariffs.json || true && python manage.py loaddata solar_data/fixtures/solar_equipment_2026.json || true && python manage.py create_admin && python -c \"import django; import os; os.environ.setdefault('DJANGO_SETTINGS_MODULE','shamsi_smart.settings.production'); django.setup(); from solar_data.models import DailyClimateData; exit(0 if DailyClimateData.objects.exists() else 1)\" || python manage.py import_solar_data data/egypt_solar_data_2018_2026.csv --skip-existing && python manage.py train_ai_models || true && gunicorn shamsi_smart.wsgi:application --workers 2 --bind 0.0.0.0:$PORT --timeout 180"
