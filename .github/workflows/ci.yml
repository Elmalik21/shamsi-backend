name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: shamsi
          POSTGRES_PASSWORD: shamsi_test
          POSTGRES_DB: shamsi_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install reportlab matplotlib openpyxl pytest pytest-cov

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://shamsi:shamsi_test@localhost/shamsi_test
          DJANGO_SETTINGS_MODULE: shamsi_smart.settings.production
          SECRET_KEY: test-secret-key-for-ci-only
        run: python manage.py migrate --run-syncdb

      - name: Run export tests (no DB required)
        run: |
          python -m pytest tests/test_exports.py -v --tb=short

      - name: Run validation script
        run: |
          python scripts/validate_with_case_studies.py --json

      - name: Check syntax — all Python files
        run: |
          python -m py_compile \
            ai_engine/export/pvsyst_exporter.py \
            ai_engine/export/helioscope_exporter.py \
            ai_engine/export/pdf_report.py \
            ai_engine/export/excel_exporter.py \
            api/views/export_view.py \
            scripts/validate_with_case_studies.py
          echo "All syntax checks passed"

  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install flake8
      - name: Lint
        run: |
          flake8 ai_engine/ api/ scripts/ \
            --max-line-length=100 \
            --exclude=*/migrations/*,*/settings/* \
            --count --statistics
