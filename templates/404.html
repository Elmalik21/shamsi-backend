<!-- templates/404.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Shamsi Smart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
        }
        .error-icon {
            font-size: 80px;
            color: #dc3545;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">
            <i class="fas fa-exclamation-triangle"></i>
        </div>
        <h1 class="display-4 text-danger mb-3">404 - Page Not Found</h1>
        <p class="lead mb-4">
            The page you are looking for doesn't exist or has been moved.
        </p>
        <div class="row g-3">
            <div class="col-md-6">
                <a href="/" class="btn btn-primary btn-lg w-100">
                    <i class="fas fa-home"></i> Go to Dashboard
                </a>
            </div>
            <div class="col-md-6">
                <a href="{% url 'api-docs' %}" class="btn btn-secondary btn-lg w-100">
                    <i class="fas fa-book"></i> API Documentation
                </a>
            </div>
        </div>
        <hr class="my-4">
        <p class="text-muted small">
            <i class="fas fa-info-circle"></i> 
            If this error persists, please contact support at info@shamsismart.eg
        </p>
    </div>
</body>
</html>
